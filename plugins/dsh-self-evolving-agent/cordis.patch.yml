- insert:
  - id: '@kiwifruit/dsh-self-evolving-agent'
    name: '@kiwifruit/dsh-self-evolving-agent'
    config:
      # dbPath 必填：优先 SELF_EVOLVING_DB，否则回退到当前用户的 profile 目录默认库（开箱即用、可移植）
      # 注意：YAML 中 !!js 含 `?`/`:`，整行需保持单行 JS 表达式
      dbPath: !!js process.env.SELF_EVOLVING_DB ?? ((process.env.USERPROFILE ?? process.env.HOME ?? '').replace(/\\/g, '/') + '/.dsh/profiles/web/self-evolving-agents.db')
      pythonBin: python
      # serveScript 默认从插件自身目录发现，无需环境变量
      # 如需覆盖，设置 SELF_EVOLVING_SERVE_SCRIPT
      reconnectIntervalMs: 5000