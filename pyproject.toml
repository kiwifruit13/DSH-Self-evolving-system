[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-evolving-agent"
version = "0.1.0"
description = "受控自进化 AI Agent 框架 — 读写分离 + 路由表 + 标签遗传 + 反馈举证"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.3",
    "mypy>=1.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
# 覆盖率与 bdd 为可选增强：如需启用，安装 pytest-cov / pytest-bdd 并放开以下配置
# addopts = "--cov=src --cov-report=term-missing --tb=short"
# bdd_features_base_dir = "features/"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]

# serve.py 在模块顶部插入 sys.path 以定位 src/ 包（sys.path bootstrap），
# 紧随其后的模块级 import 因此触发 E402。该 bootstrap 是有意为之，非错误。
#
# 路径用通配：serve.py 的唯一真源是 Cordis 插件内的副本
# （根 scripts/serve.py 开发副本已于 2026-09-03 删除，见 contract-todo.md）。
[tool.ruff.lint.per-file-ignores]
"**/scripts/serve.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true